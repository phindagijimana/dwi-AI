[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nodestrength"
version = "0.1.0"
description = "Reimplementation of Piper et al. 2026 (Epilepsia) thalamocortical structural-connectivity pipeline."
readme = "node.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "scipy>=1.10",
    "nibabel>=5.0",
    "reportlab>=4.0",
    "matplotlib>=3.7",
    "nilearn>=0.10.2,<0.14",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
bct = ["bctpy>=0.5"]
viz = [
    "vtk>=9.1,<9.3; python_version<'3.12'",
    "vtk>=9.3,<9.4; python_version>='3.12'",
    "enigmatoolbox @ git+https://github.com/MICA-MNI/ENIGMA.git",
]

[project.scripts]
nodestrength = "nodestrength.cli:main"
dkt-ai-cohort = "nodestrength.dk_cohort:main"
dk-ai-cohort = "nodestrength.dk_cohort:main"

[tool.setuptools.packages.find]
include = ["nodestrength*"]
exclude = ["tests*", "scripts*"]

[tool.setuptools.package-data]
nodestrength = ["data/parcellations/*.csv"]
